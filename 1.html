<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h2,h3,p{
            padding: 0;
            margin: 0;
        }
        #box{
            width: 480px;
            padding: 8PX;
            border: 1px solid #ccc;
            font-size: 12px;
            margin: 20px;
        }
        #box h3{
            font-size: 16px;
            /*居中*/
            text-align: center;
            line-height: 33px;
            /*字间距3px*/
            letter-spacing: 3px;
            color: cornflowerblue;
        }
        #box p{
            line-height: 150%;
            color:coral
            text-indent: 2em;
        }
        #box a{
            color: crimson;
            text-decoration: none;
        }
        /* ========== 新增扩展样式 ========== */
        /* 学号：蓝色加粗 */
        .sid {
            color: blue;
            font-weight: bold;
        }
        /* 姓名：深色加粗 */
        .mname {
            color: #222;
            font-weight: bold;
        }
        /* 难度文字：红色加粗 */
        .level {
            color: red;
            font-weight: bold;
        }
        /* 知识点区域：紫色边框，边框为额外内容（box-sizing: content-box） */
        .know-box {
            border: 2px solid purple;
            box-sizing: content-box; /* 边框属于额外内容，不压缩宽度 */
            padding: 2px 4px;
            /* 取消inline-block，改用inline，保证同一行不轻易换行 */
            display: inline;
        }
    </style>
</head>
<body>
   <h2> css进阶 </h2>   
   <div id="box">
      <h3>css那些事</h3>
      <p>
        学号:<span class="sid">0422</span>,姓名:<span class="mname">马欣宇</span>，班级：计算机24004，对于《高级网页设计》课程的难度认知为：<span class="level">难</span>，
        这个例子对应的知识点是：<span class="know-box">群组选择器、后代选择器、层叠与继承</span>。
        <a href="#"> 更多 </a>
      </p>
   </div>
</body>
</html>
