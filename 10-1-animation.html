<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4 色背景动画</title>
  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0;
      background: #fff;
      font-family: Arial, sans-serif;
    }

    .box {
      width: 200px;
      height: 200px;
      border-radius: 20px;
      animation: bg-change 8s linear infinite;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    @keyframes bg-change {
      0% {
        background-color: #ff6b6b;
        transform: translateY(0) rotate(-8deg) scale(0.9);
        border-radius: 25% 75% 30% 70%;
        box-shadow: 0 10px 25px rgba(255, 107, 107, 0.35);
      }
      25% {
        background-color: #feca57;
        transform: translateY(-18px) rotate(8deg) scale(1);
        border-radius: 75% 25% 70% 30%;
        box-shadow: 0 18px 30px rgba(254, 202, 87, 0.4);
      }
      50% {
        background-color: #48dbfb;
        transform: translateY(-8px) rotate(-8deg) scale(1.08);
        border-radius: 30% 70% 25% 75%;
        box-shadow: 0 22px 35px rgba(72, 219, 251, 0.45);
      }
      75% {
        background-color: #1dd1a1;
        transform: translateY(10px) rotate(8deg) scale(0.95);
        border-radius: 70% 30% 75% 25%;
        box-shadow: 0 14px 28px rgba(29, 209, 161, 0.38);
      }
      100% {
        background-color: #ff6b6b;
        transform: translateY(0) rotate(-8deg) scale(0.9);
        border-radius: 25% 75% 30% 70%;
        box-shadow: 0 10px 25px rgba(255, 107, 107, 0.35);
      }
    }
  </style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
