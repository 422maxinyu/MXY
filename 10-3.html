<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>马欣宇幻灯片</title>
  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0;
      background: #f3f4f6;
      font-family: Arial, "Microsoft YaHei", sans-serif;
    }

    .slider {
      position: relative;
      width: min(90vw, 600px);
      height: 700px;
      overflow: hidden;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
    }

    .slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transform: translateX(100%);
    }

    .slide img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .content {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      padding: 32px 24px;
      text-align: center;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(2px);
    }

    .content h1 {
      margin: 0;
      color: #fff;
      font-size: clamp(28px, 5vw, 40px);
      letter-spacing: 2px;
    }

    .content p {
      margin: 10px 0 0;
      color: #fff;
      font-size: 18px;
    }

    .slide:nth-child(1) {
      z-index: 3;
      animation: slide-1 12s infinite;
    }

    .slide:nth-child(2) {
      z-index: 2;
      animation: slide-2 12s infinite;
      animation-delay: 4s;
    }

    .slide:nth-child(3) {
      z-index: 1;
      animation: slide-3 12s infinite;
      animation-delay: 8s;
    }

    @keyframes slide-1 {
      0%, 25% { opacity: 1; transform: translateX(0); }
      33%, 100% { opacity: 0; transform: translateX(-100%); }
    }

    @keyframes slide-2 {
      0%, 25% { opacity: 0; transform: translateX(100%); }
      33%, 58% { opacity: 1; transform: translateX(0); }
      66%, 100% { opacity: 0; transform: translateX(-100%); }
    }

    @keyframes slide-3 {
      0%, 58% { opacity: 0; transform: translateX(100%); }
      66%, 92% { opacity: 1; transform: translateX(0); }
      100% { opacity: 0; transform: translateX(-100%); }
    }
  </style>
</head>
<body>
  <div class="slider" aria-label="马欣宇照片幻灯片">
    <section class="slide">
      <img src="img/1.jpg" alt="图片 1">
      <div class="content">
        <h1>马欣宇</h1>
        <p>热爱生活，勇敢前行</p>
      </div>
    </section>

    <section class="slide">
      <img src="img/2.jpg" alt="图片 2">
      <div class="content">
        <h1>马欣宇</h1>
        <p>保持好奇，追求进步</p>
      </div>
    </section>

    <section class="slide">
      <img src="img/3.jpg" alt="图片 3">
      <div class="content">
        <h1>马欣宇</h1>
        <p>向着梦想，不断前行</p>
      </div>
    </section>
  </div>
</body>
</html>
