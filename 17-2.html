<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 姓名：马欣宇；日期：2026-11-02；功能名称：使用 Fetch 获取接口数据 -->
    <meta name="description" content="课堂实践 17-2：使用原生 Fetch API 获取并展示 JSONPlaceholder 用户数据">
    <title>17-2 · Fetch 接口数据</title>
    <style>
        :root {
            --yl_ink: #202b3d;
            --yl_muted: #758097;
            --yl_paper: #f3f5fa;
            --yl_card: #fff;
            --yl_blue: #4968ca;
            --yl_border: #e3e8f2;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 44px 20px;
            background: var(--yl_paper);
            color: var(--yl_ink);
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }

        .yl_page {
            width: min(1020px, 100%);
            margin: 0 auto;
        }

        .yl_header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 24px;
        }

        .yl_kicker {
            margin: 0 0 10px;
            color: var(--yl_blue);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.12em;
        }

        h1 {
            margin: 0;
            font-size: clamp(28px, 5vw, 42px);
            letter-spacing: -0.04em;
        }

        .yl_subtitle {
            margin: 10px 0 0;
            color: var(--yl_muted);
            line-height: 1.7;
        }

        .yl_button {
            flex: 0 0 auto;
            padding: 11px 16px;
            border: 0;
            border-radius: 10px;
            background: var(--yl_blue);
            color: white;
            cursor: pointer;
            font: inherit;
            font-size: 14px;
            font-weight: 700;
        }

        .yl_button:hover {
            background: #3855b0;
        }

        .yl_button:focus-visible {
            outline: 3px solid #aebcf3;
            outline-offset: 3px;
        }

        .yl_status {
            min-height: 24px;
            margin: 0 0 16px;
            color: var(--yl_muted);
            font-size: 14px;
        }

        .yl_status.yl_error {
            color: #b42318;
        }

        .yl_user-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        .yl_user-card {
            min-width: 0;
            padding: 20px;
            border: 1px solid var(--yl_border);
            border-radius: 15px;
            background: var(--yl_card);
            box-shadow: 0 8px 24px rgb(35 48 77 / 4%);
        }

        .yl_user-heading {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
        }

        .yl_avatar {
            display: grid;
            width: 42px;
            height: 42px;
            flex: 0 0 auto;
            place-items: center;
            border-radius: 50%;
            background: #e8edff;
            color: var(--yl_blue);
            font-weight: 700;
        }

        .yl_user-card h2 {
            margin: 0;
            font-size: 17px;
        }

        .yl_company {
            margin: 4px 0 0;
            color: var(--yl_muted);
            font-size: 13px;
        }

        .yl_details {
            display: grid;
            gap: 7px;
            margin: 0;
            color: #46536b;
            font-size: 13px;
            line-height: 1.6;
        }

        .yl_details a {
            color: var(--yl_blue);
            overflow-wrap: anywhere;
        }

        @media (max-width: 640px) {
            body {
                padding: 30px 16px;
            }

            .yl_header {
                align-items: flex-start;
                flex-direction: column;
            }

            .yl_user-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <main class="yl_page">
        <header class="yl_header">
            <div>
                <p class="yl_kicker">CLASSROOM PRACTICE · 17-2</p>
                <h1>Fetch 接口数据</h1>
                <p class="yl_subtitle">从 JSONPlaceholder 获取用户数据，并用原生 DOM 渲染列表。</p>
            </div>
            <button class="yl_button" id="yl_reload" type="button">重新获取</button>
        </header>
        <p class="yl_status" id="yl_status" role="status" aria-live="polite">正在连接接口…</p>
        <section class="yl_user-grid" id="yl_user-list" aria-label="用户列表"></section>
    </main>
    <script>
        const yl_apiUrl = "https://jsonplaceholder.typicode.com/users";
        const yl_status = document.getElementById("yl_status");
        const yl_userList = document.getElementById("yl_user-list");
        const yl_reloadButton = document.getElementById("yl_reload");

        function yl_createUserCard(yl_user) {
            const yl_card = document.createElement("article");
            const yl_heading = document.createElement("div");
            const yl_avatar = document.createElement("span");
            const yl_identity = document.createElement("div");
            const yl_name = document.createElement("h2");
            const yl_company = document.createElement("p");
            const yl_details = document.createElement("div");
            const yl_email = document.createElement("a");
            const yl_phone = document.createElement("p");
            const yl_website = document.createElement("p");

            yl_card.className = "yl_user-card";
            yl_heading.className = "yl_user-heading";
            yl_avatar.className = "yl_avatar";
            yl_identity.className = "yl_identity";
            yl_company.className = "yl_company";
            yl_details.className = "yl_details";
            yl_name.textContent = yl_user.name || "未命名用户";
            yl_avatar.textContent = (yl_user.name || "?").slice(0, 1);
            yl_company.textContent = yl_user.company?.name || "未提供公司信息";
            yl_email.href = `mailto:${yl_user.email || ""}`;
            yl_email.textContent = yl_user.email || "未提供邮箱";
            yl_phone.textContent = `电话：${yl_user.phone || "未提供"}`;
            yl_website.textContent = `网站：${yl_user.website || "未提供"}`;

            yl_identity.append(yl_name, yl_company);
            yl_heading.append(yl_avatar, yl_identity);
            yl_details.append(yl_email, yl_phone, yl_website);
            yl_card.append(yl_heading, yl_details);
            return yl_card;
        }

        async function yl_loadUsers() {
            yl_reloadButton.disabled = true;
            yl_userList.replaceChildren();
            yl_status.classList.remove("yl_error");
            yl_status.textContent = "正在获取用户数据…";

            try {
                const yl_response = await fetch(yl_apiUrl);
                if (!yl_response.ok) {
                    throw new Error(`接口请求失败：HTTP ${yl_response.status}`);
                }

                const yl_users = await yl_response.json();
                if (!Array.isArray(yl_users)) {
                    throw new Error("接口返回的数据格式不正确，未找到用户列表。");
                }

                yl_userList.append(...yl_users.map(yl_createUserCard));
                yl_status.textContent = `获取成功，共 ${yl_users.length} 位用户。`;
            } catch (yl_error) {
                yl_status.classList.add("yl_error");
                yl_status.textContent = `数据加载失败：${yl_error.message}。请检查网络后重试。`;
            } finally {
                yl_reloadButton.disabled = false;
            }
        }

        yl_reloadButton.addEventListener("click", yl_loadUsers);
        yl_loadUsers();
    </script>
</body>
</html>
