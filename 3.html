<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>层叠样式表CSS</title>
    <style>
        /* id选择器，#开头 */
        #box{

        }
        /* 类选择器，.开头 */
        .n1{
            color: blue;
        }

        /* 扩展2：h2黑底白字 */
        h2{
            background-color: black;
            color: white;
        }

        /* 扩展1：名字每个字不同颜色 */
        .zi-qi{
            color: red;
        }
        .zi-yuan{
            color: green;
        }
        .zi-ming{
            color: blue;
        }

        /* 扩展3方案A：“选择器”三个字白色 */
        .sel-word{
            color: white;
        }

        /* 扩展3方案B：300*300盒子，背景色 */
        .big-box{
            width: 300px;
            height: 300px;
            background-color: #3498db;
        }
    </style>
</head>
<body>
    <h2>层叠样式表 CSS</h2>
    <div id="box">
        <p>CSS<span class="sel-word">选择器</span></p >
        <!--扩展1：span行内元素，文字不换行-->
        <p><span class="zi-qi">马</span><span class="zi-yuan">欣</span><span class="zi-ming">宇</span></p >
        <p>CSS属性</p >
    </div>

    <!--扩展3方案B：300×300色块盒子-->
    <div class="big-box"></div>

</body>
</html>
