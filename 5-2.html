<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盒模型。框模型，box model</title>
    <style>
        body,h2,u1,p{
            padding: 0;
            margin: 0;
        }
        #a{
            width: 400px;
            height: 400px;
            border:1px solid #039;
            padding: 50px 40px 30px 20px;/* 上 右 下 左 */
            margin:40px auto;
        }
        #b{
            width: 400px;
            height: 400px;
            border:1px dashed #039;
            margin:50px auto 40px;/* 上 左右 下 */
            
        }
    </style>
</head>
<body>
    <div id="a">422 马欣宇</div>
    <div id="b">422 马欣宇</div>
    <div id="c">422 马欣宇</div>
    <div id="d">422 马欣宇</div>
</body>
</html>
