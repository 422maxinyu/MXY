<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #efefef;
            font-family: Arial, sans-serif;
        }

        .flex{
            /* 容器 */
            display: flex;
            /* 子元素在一行显示 */
            flex-wrap:wrap;
        }
        .flex li{
            /* float:left; */
            width: 49%;
            height: 100px;
            border: 1px solid #333;
            line-height: 100px;
            list-style: none;
            text-align: center;
            flex-grow:1;
            display: flex;
        }
        .flex li:nth-child(1){
            align-items: center;/* 垂直居中 */
            justify-content: center; /* 水平居中 */
        }
        .box{
            width: 50%;
            height: 50%;
            background: rgb(210, 108, 108);
        }
        .flex li:nth-child(1)  .box{
            background:#333;
        }

        .demo-board {
            display: flex;
            width: 100%;
            height: 340px;
            background: #dedede;
            border-top: 1px solid #5d5d5d;
            border-bottom: 1px solid #5d5d5d;
            overflow: hidden;
        }

        .panel {
            position: relative;
            flex: 1 1 25%;
            height: 100%;
            background: #e8e8e8;
            border-right: 1px solid #5d5d5d;
        }

        .panel:first-child {
            border-left: 1px solid #5d5d5d;
        }

        .panel .block {
            background: #d5d5d5;
            border: 1px solid #2c2c2c;
            position: absolute;
        }

        .panel-one .block {
            width: 140px;
            height: 140px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        .panel-two {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 24px;
        }

        .panel-two .block {
            width: 210px;
            height: 90px;
            position: static;
        }

        .panel-three {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .panel-three .matrix {
            display: grid;
            grid-template-columns: repeat(2, 112px);
            grid-template-rows: repeat(2, 112px);
            gap: 18px 18px;
        }

        .panel-three .block {
            position: static;
            width: 112px;
            height: 112px;
        }

        .panel-four {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 18px;
        }

        .panel-four .top-block {
            width: 270px;
            height: 98px;
            display: block;
            background: #d5d5d5;
            border: 1px solid #2c2c2c;
        }

        .panel-four .bottom-row {
            display: flex;
            gap: 18px;
        }

        .panel-four .bottom-row .block {
            position: static;
            width: 120px;
            height: 120px;
        }
    </style>
</head>
<body>
    <h2>马欣宇 flex</h2>
    <ul class="flex">
        <li>
            <div class="box"></div>
        </li>
        <li>1</li>
        <li>2</li>
        <li>3</li>
        <li>4</li>
    </ul>
    <h2>浮点之后</h2>

    <div class="demo-board">
        <div class="panel panel-one">
            <div class="block"></div>
        </div>

        <div class="panel panel-two">
            <div class="block"></div>
            <div class="block"></div>
        </div>

        <div class="panel panel-three">
            <div class="matrix">
                <div class="block"></div>
                <div class="block"></div>
                <div class="block"></div>
                <div class="block"></div>
            </div>
        </div>

        <div class="panel panel-four">
            <div class="top-block"></div>
            <div class="bottom-row">
                <div class="block"></div>
                <div class="block"></div>
            </div>
        </div>
    </div>
</body>
</html>
