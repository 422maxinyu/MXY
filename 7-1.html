<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0;
            padding:0;
        }
        ul{
            list-style: none;
        }
        img{
            display: block;
        }
        .ilist{
            display: flex;
            margin: 8px;
            
        }
        .ilist li{
            width:30%;
            margin-right:1px;
            flex-grow: 1;
            position: relative;
        }
        .ilist img{
            width:100%;
        }
        .ilist p{
            /* 居中 */
            text-align: center;
            font-size: 14px;
            line-height: 33px;
            /* 绝对定位 */
            position: absolute;
            bottom: 0;
            width: 100%;
            background: rgba(0,0,0,.5);
            color: #fff;
            /* 加粗 */
            font-weight: bold;
        }
    </style>
</head>
<body>
    <ul class="ilist">
        <li><img src="./img/2.jpg">
            <p>我国粮食产业有望实现年工业总产值4.5万亿元以上</p>
        </li>
        <li>
            <img src="./img/3.jpg">
            <p>“双节”出游预订火爆 旅游市场有望结构性改善</p>
        </li>
        <li>
            <img src="./img/4.jpg">
            <p>第二十届榆林国际煤博会、第四届西部氢能博览会闭幕</p>
        </li>
    </ul>
</body>
</html>
