<!doctype html>
<html lang="zh-CN">
<head>
  <!-- 姓名：马欣宇；日期：2026-11-09；功能名称：小米商城图文列表 -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10141e">
  <title>精选好物 · 小米商城</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <canvas class="ma_background" aria-hidden="true"></canvas>
  <main class="ma_shell">
    <header class="ma_topbar">
      <a class="ma_brand" href="./index.html" aria-label="返回小米商城首页">
        <span class="ma_brand-mark">MY</span>
        <span>小米商城</span>
      </a>
      <a class="ma_back-link" href="./index.html">返回首页 <span aria-hidden="true">↗</span></a>
    </header>

    <section class="ma_gallery-main" aria-labelledby="ma_gallery-title">
      <div class="ma_gallery-heading">
        <div>
          <p class="ma_eyebrow">DISCOVER <span>—</span> MI COLLECTION</p>
          <h1 id="ma_gallery-title">精选<span class="ma_name">好物</span><span class="ma_cursor">.</span></h1>
          <p class="ma_lead">精选数码与智能生活好物，每一件都为日常增添一点灵感。</p>
        </div>
        <div class="ma_gallery-stamp" aria-hidden="true">
          <span>MI</span>
          <small>SELECTED</small>
        </div>
      </div>

      <section class="ma_gallery-api" aria-labelledby="ma_gallery-api-title">
        <div>
          <p class="ma_gallery-api-label" id="ma_gallery-api-title">图文数据接口</p>
          <a class="ma_api-link" id="ma_gallery-api-link" href="/api/gallery" target="_blank" rel="noopener">
            http://localhost:8422/api/gallery
          </a>
        </div>
        <span class="ma_api-method">GET</span>
      </section>

      <div class="ma_gallery-toolbar">
        <h2>为生活精选 <span class="ma_gallery-total" id="ma_gallery-total">读取中</span></h2>
        <p class="ma_gallery-status" id="ma_gallery-status" role="status" aria-live="polite">正在从数据库加载商品…</p>
      </div>

      <section class="ma_gallery-grid" id="ma_gallery-grid" aria-label="精选商品图文列表">
        <p class="ma_gallery-empty">正在读取图文数据…</p>
      </section>

      <details class="ma_json-details">
        <summary>查看接口返回的 JSON 数据</summary>
        <pre class="ma_json-output" id="ma_gallery-json">等待接口返回数据…</pre>
      </details>
    </section>

    <footer class="ma_footer">
      <span>用好奇心构建，用细节表达。</span>
      <span>马欣宇 <span class="ma_footer-dot">·</span> 2026</span>
    </footer>
  </main>
  <script src="./js/app.js" defer></script>
  <script src="./js/gallery.js" defer></script>
</body>
</html>
